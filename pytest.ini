[pytest]
testpaths = tests
# Корень проекта в sys.path: без этого `pytest` из CI не видит пакет app,
# а локальный запуск через `python -m pytest` маскирует проблему.
pythonpath = .
asyncio_mode = auto
addopts = -ra -q --tb=short
filterwarnings =
    ignore::DeprecationWarning

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]